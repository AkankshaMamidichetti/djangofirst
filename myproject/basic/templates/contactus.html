<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

nav {
    background: #333;
    padding: 15px;
}

nav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 30px;
}

nav ul li a {
    color: white;
    text-decoration: none;
    font-size: 18px;
    padding: 8px 14px;
    border-radius: 6px;
    transition: 0.3s;
}

nav ul li a:hover,
nav ul li a.active {
    background: #ff9800;
}

.content {
    text-align: center;
    margin-top: 80px;
}

.content h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.content p {
    font-size: 20px;
    color: #555;
}
</style>
<body>

    <nav>
        <ul>
             <li><a class="active" href="{% url 'index' %}">Home</a></li>
            <li><a href="{% url 'services' %}">Services</a></li>
            <li><a href="{% url 'aboutus' %}">About Us</a></li>
            <li><a href="{% url 'contactus' %}l">Contact Us</a></li>
        </ul>
    </nav>

    <section class="content">
        <h1>Contact Us</h1>
        <p>You can reach us here...</p>
    </section>

</body>
</html>
